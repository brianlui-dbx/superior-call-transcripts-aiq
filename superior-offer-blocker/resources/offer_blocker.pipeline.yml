# =============================================================================
# Spark Declarative Pipeline (SDP) — the heart of the POC.
# Runs bronze -> silver -> gold entirely on serverless compute.
# The `configuration` block below publishes each bundle variable as a pipeline
# setting so the SQL files can read it with ${key} substitution
# (e.g. ${catalog}, ${region_1}).
# =============================================================================
resources:
  pipelines:
    offer_blocker_pipeline:
      name: offer_blocker_poc_aiq
      serverless: true          # no cluster to size or manage
      catalog: ${var.catalog}   # where published tables land
      schema: ${var.schema}
      channel: CURRENT
      # Root and transformation glob match the pipeline as edited in the workspace.
      root_path: ../pipeline
      libraries:
        - glob:
            include: ../pipeline/transformations/**
      # These become spark confs readable as ${key} inside the SQL.
      configuration:
        catalog: ${var.catalog}
        schema: ${var.schema}
        model_endpoint: ${var.model_endpoint}
        prompt_version: ${var.prompt_version}
        region_1: ${var.region_1}
        region_2: ${var.region_2}
        input_multiline: ${var.input_multiline}
